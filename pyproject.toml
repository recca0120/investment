[project]
name = "invest"
version = "0.1.0"
description = "股市新手的投資輔助系統"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket -m 'not contract'"
filterwarnings = [
  "ignore::pandas.errors.Pandas4Warning:streamlit",  # Streamlit 內部用到 pandas 即將棄用的參數
]
markers = [
  "criteria(id): 對應 issue 的驗收條件編號，例如 #5-1",
  "contract: 需要連網、驗證真實資料來源（預設不跑，用 -m contract 執行）",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.88.0",
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    "pytest-socket>=0.8.1",
    "time-machine>=3.6.0",
    "yfinance>=1.7.0",
]
